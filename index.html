<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Países do Mundo - Consumo de API</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Países do Mundo</h1>
    <p>Busque informações de qualquer país usando a <a href="https://restcountries.com" target="_blank" rel="noopener">REST Countries API</a></p>
  </header>

  <main>
    <form id="search-form" autocomplete="off">
      <input
        type="text"
        id="search-input"
        placeholder="Ex: brazil, japan, france"
        aria-label="Nome do país"
      />
      <button type="submit" id="search-button">Buscar</button>
    </form>

    <section id="feedback" aria-live="polite"></section>

    <section id="results-container" hidden></section>
  </main>

  <footer>
    <p>Seminário - Consumo de API com HTML, CSS e JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
